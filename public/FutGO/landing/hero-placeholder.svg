<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Imagen de cancha de fútbol amateur">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c853"/>
      <stop offset="1" stop-color="#00913c"/>
    </linearGradient>
    <pattern id="chalk" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M0 32h64M32 0v64" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#g)"/>
  <rect width="800" height="1000" fill="url(#chalk)"/>
  <!-- Lineas de cancha -->

  <circle cx="400" cy="500" r="130" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
  <line x1="0" y1="500" x2="800" y2="500" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
  <rect x="250" y="60" width="300" height="150" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
  <rect x="250" y="790" width="300" height="150" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
</svg>
